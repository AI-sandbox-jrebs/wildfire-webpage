name: Refresh long-term history

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh long-term history
        run: python scripts/fetch_history.py
      - name: Persist changed history
        run: |
          if [[ -n "$(git status --porcelain data/longterm.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/longterm.json
            git commit -m "data: refresh long-term history [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
